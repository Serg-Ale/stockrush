spring.application.name=payment-service

server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payments}
spring.datasource.username=${DB_USER:payments}
spring.datasource.password=${DB_PASSWORD:payments}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Same HS256 key the api signs its JWTs with (at least 32 bytes). Required; no default on purpose.
app.security.jwt-secret=${JWT_SECRET}

# Chaos control defaults (changeable at runtime through PUT /chaos): share of attempts that fail temporarily,
# and how long tok_slow takes to answer.
app.chaos.failure-rate=0
app.chaos.latency=PT2S
