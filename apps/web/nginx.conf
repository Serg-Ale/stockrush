# Single entry point: the SPA, and the api and payment-service routes behind it (the same paths proxy.conf.json
# uses in development). The app's own routes are in Portuguese (/catalogo, /pedidos, /painel, /entrar), so they
# never collide with the api paths below.
server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~ ^/(auth|orders|products|me|admin|v3)(/|$) {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The order stream is server-sent events: no buffering, and a read timeout well past the 15 s keep-alive.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location /chaos {
    proxy_pass http://payment-service:8081;
    proxy_set_header Host $host;
  }
}
