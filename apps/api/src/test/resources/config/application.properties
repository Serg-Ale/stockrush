app.security.jwt-secret=test-only-secret-test-only-secret-0123456789

# Tests call OutboxPublisher.publishPending() themselves; the scheduler must not race them.
app.outbox.poll-interval=PT1H
app.demo-admin.password=demo-admin-test-password
# Effectively off for the shared suite (one address fires hundreds of requests); RateLimitTests lowers it.
app.rate-limit.requests=1000000
