spring.application.name=api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stockrush}
spring.datasource.username=${DB_USER:stockrush}
spring.datasource.password=${DB_PASSWORD:stockrush}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

spring.mvc.problemdetails.enabled=true

# HS256 signing key for self-issued JWTs (at least 32 bytes). Required; no default on purpose.
app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-ttl=PT1H
