spring.application.name=api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stockrush}
spring.datasource.username=${DB_USER:stockrush}
spring.datasource.password=${DB_PASSWORD:stockrush}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

spring.mvc.problemdetails.enabled=true

# HS256 signing key for self-issued JWTs (at least 32 bytes). Required; no default on purpose.
app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-ttl=PT1H

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated

# Outbox publisher: how often to poll, how many rows per batch, how long to wait for each broker confirm.
app.outbox.poll-interval=PT0.5S
app.outbox.batch-size=50
app.outbox.confirm-timeout=PT5S

# Demonstration ADMIN, created at startup only when a password is provided (never set it in production).
app.demo-admin.email=admin@stockrush.demo
app.demo-admin.password=${DEMO_ADMIN_PASSWORD:}
