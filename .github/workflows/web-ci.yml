name: web-ci

on:
  push:
  pull_request:

jobs:
  client-up-to-date:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Regenerate the API client from apps/api/openapi.json
        run: npm run generate:api
      - name: Fail if the committed client is stale
        run: git diff --exit-code -- . ':!package-lock.json' && test -z "$(git ls-files --others --exclude-standard .)"
