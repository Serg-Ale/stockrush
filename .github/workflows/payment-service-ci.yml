name: payment-service-ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/payment-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - name: Coverage summary
        if: always()
        run: |
          f=target/site/jacoco/jacoco.csv
          [ -f "$f" ] && awk -F, -v svc="payment-service" 'NR>1 {mi+=$4; ci+=$5; mb+=$6; cb+=$7; ml+=$8; cl+=$9} END {printf "### %s coverage\n\ninstructions %.1f%% · branches %.1f%% · lines %.1f%%\n", svc, 100*ci/(mi+ci), 100*cb/(mb+cb), 100*cl/(ml+cl)}' "$f" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-service-jacoco
          path: apps/payment-service/target/site/jacoco
          if-no-files-found: ignore
